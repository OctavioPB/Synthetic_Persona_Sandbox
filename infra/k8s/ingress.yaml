apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spb-ingress
  namespace: spb
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"   # allow long simulation WS connections
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # WebSocket support for /ws/* routes
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # Security headers
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.syntheticpersonasandbox.com
        - api.syntheticpersonasandbox.com
      secretName: spb-tls
  rules:
    - host: api.syntheticpersonasandbox.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spb-api
                port:
                  number: 80
    - host: app.syntheticpersonasandbox.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: spb-api
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: spb-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spb-dashboard
                port:
                  number: 80
