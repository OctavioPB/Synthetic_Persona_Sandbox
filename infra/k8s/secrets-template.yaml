# ── TEMPLATE — do NOT commit real values ─────────────────────────────────────
# Create this secret in each cluster via:
#   kubectl create secret generic spb-secrets -n spb \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=REDIS_PASSWORD=...
#
# Or with Vault / AWS Secrets Manager via the External Secrets Operator:
#   see infra/k8s/external-secrets.yaml (provisioned separately)
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: spb-secrets
  namespace: spb
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"           # min 32 chars, high-entropy random string
  REDIS_PASSWORD: "REPLACE_ME"
  SLACK_ALERT_WEBHOOK: "REPLACE_ME"  # optional — for PagerDuty/Slack alerts
