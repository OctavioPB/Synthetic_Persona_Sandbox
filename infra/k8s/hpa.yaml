apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spb-api-hpa
  namespace: spb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spb-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # 5 min cool-down before scale-in
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spb-worker-hpa
  namespace: spb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spb-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600   # 10 min — avoid thrashing during LLM burst
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
