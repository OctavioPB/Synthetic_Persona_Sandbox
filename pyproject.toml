[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthetic-persona-sandbox"
version = "0.1.0"
description = "AI-powered marketing simulation platform with synthetic customer personas"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0",
    "qdrant-client>=1.9.0",
    "kafka-python>=2.0.0",
    "fastavro>=1.9.0",
    "anthropic>=0.40.0",
    "sentence-transformers>=3.0.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pre-commit>=3.7.0",
]
airflow = [
    "apache-airflow>=2.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "ingestion", "orchestration", "ml"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
