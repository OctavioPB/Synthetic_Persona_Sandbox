name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ── Python lint & type-check ───────────────────────────────────────────────
  python-lint:
    name: Python — Ruff + Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy api/ ingestion/ ml/

  # ── Python tests ──────────────────────────────────────────────────────────
  python-tests:
    name: Python — Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: synthetic_persona_test
          POSTGRES_USER: spb_user
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: synthetic_persona_test
          POSTGRES_USER: spb_user
          POSTGRES_PASSWORD: changeme
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ENV: test
        run: uv run pytest tests/unit/ -v --tb=short

  # ── Avro schema validation (S2-05) ────────────────────────────────────────
  schema-validation:
    name: Avro Schemas — Parse & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Validate all .avsc schemas can be parsed by fastavro
        run: |
          uv run python -c "
          import json
          import fastavro
          from pathlib import Path
          schemas = list(Path('ingestion/schemas').glob('*.avsc'))
          assert schemas, 'No .avsc files found!'
          for p in schemas:
              with p.open() as f:
                  schema = json.load(f)
              fastavro.parse_schema(schema)
              print(f'  OK  {p.name}')
          print(f'All {len(schemas)} schemas valid.')
          "

  # ── Dashboard lint & build ─────────────────────────────────────────────────
  dashboard:
    name: Dashboard — ESLint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: Build
        run: npm run build
